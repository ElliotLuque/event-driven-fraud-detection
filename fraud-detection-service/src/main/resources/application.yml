server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/fraud}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:6}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fraud.detection.events"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fraud.detection.events.TransactionCreatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    template:
      observation-enabled: true
    listener:
      type: batch
      ack-mode: batch
      missing-topics-fatal: false
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:12}
      observation-enabled: true
    admin:
      auto-create: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        fraud_pipeline_e2e_latency: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

app:
  kafka:
    partitions: ${APP_KAFKA_PARTITIONS:18}
    replicas: ${APP_KAFKA_REPLICAS:3}
    topics:
      transactions-created: transactions.created
      fraud-detected: fraud.detected
  outbox:
    relay-interval-ms: ${APP_OUTBOX_RELAY_INTERVAL_MS:50}
    relay-initial-delay-ms: ${APP_OUTBOX_RELAY_INITIAL_DELAY_MS:1000}
    relay-batch-size: ${APP_OUTBOX_RELAY_BATCH_SIZE:200}
    retry-delay: ${APP_OUTBOX_RETRY_DELAY:PT2S}
    published-retention: ${APP_OUTBOX_PUBLISHED_RETENTION:PT24H}
    cleanup-interval-ms: ${APP_OUTBOX_CLEANUP_INTERVAL_MS:300000}
    cleanup-initial-delay-ms: ${APP_OUTBOX_CLEANUP_INITIAL_DELAY_MS:60000}
  inbox:
    processor:
      interval-ms: ${APP_INBOX_PROCESSOR_INTERVAL_MS:10}
      initial-delay-ms: ${APP_INBOX_PROCESSOR_INITIAL_DELAY_MS:0}
      batch-size: ${APP_INBOX_PROCESSOR_BATCH_SIZE:512}
      workers: ${APP_INBOX_PROCESSOR_WORKERS:8}
      claim-size: ${APP_INBOX_PROCESSOR_CLAIM_SIZE:16}
      backlog-sample-interval-runs: ${APP_INBOX_PROCESSOR_BACKLOG_SAMPLE_INTERVAL_RUNS:50}
  data-retention:
    processed-event-ttl: PT1H
    transaction-history-ttl: PT1H
    cleanup-interval: 300000
  fraud:
    rules:
      high-amount-threshold: 10000.00
      velocity-max-transactions: 5
      velocity-window: PT1M
      country-change-window: PT30M
      fraud-score-threshold: 70
      high-risk-merchants:
        - MRC-999
        - MRC-666
        - MRC-404

logging:
  level:
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.apache.kafka.common.telemetry.internals.KafkaMetricsCollector: WARN

groups:
  - name: fraud-business-alerts
    rules:
      - alert: FraudPipelineCoverageSLOViolation
        expr: |
          (
            (sum(rate(fraud_decisions_total{application="fraud-detection-service"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(transaction_events_published_total{application="transaction-service",outcome="success"}[5m])) or vector(0)), 1)
          ) < 0.95
          and on() ((sum(rate(transaction_events_published_total{application="transaction-service",outcome="success"}[5m])) or vector(0)) > 0)
        for: 10m
        labels:
          severity: critical
          team: fraud
          slo: pipeline-coverage
        annotations:
          summary: "SLO violated: pipeline coverage"
          description: "Only {{ $value | humanizePercentage }} of successfully published transactions reach a fraud decision (target >= 95%)."

      - alert: FraudToAlertConversionSLOViolation
        expr: |
          (
            (sum(rate(fraud_alerts_total{application="alert-service"}[10m])) or vector(0))
            /
            clamp_min((sum(rate(fraud_decisions_total{application="fraud-detection-service",decision="fraud"}[10m])) or vector(0)), 1)
          ) < 0.98
          and on() ((sum(rate(fraud_decisions_total{application="fraud-detection-service",decision="fraud"}[10m])) or vector(0)) > 0)
        for: 15m
        labels:
          severity: critical
          team: fraud
          slo: fraud-to-alert
        annotations:
          summary: "SLO violated: fraud-to-alert conversion"
          description: "Fraud decision to alert conversion is {{ $value | humanizePercentage }} (target >= 98%)."

      - alert: NotificationFailureRateHigh
        expr: |
          (
            sum(rate(fraud_alert_notifications_total{application="alert-service",outcome="failed"}[10m]))
            /
            clamp_min(sum(rate(fraud_alert_notifications_total{application="alert-service",outcome=~"success|failed"}[10m])), 1)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          team: fraud
          slo: notification-reliability
        annotations:
          summary: "High notification failure rate"
          description: "Failed notifications are above 5%. Current value: {{ $value | humanizePercentage }}."

      - alert: FraudEvaluationLatencyHigh
        expr: |
          (
            sum(rate(fraud_evaluation_latency_seconds_sum{application="fraud-detection-service"}[10m]))
            /
            clamp_min(sum(rate(fraud_evaluation_latency_seconds_count{application="fraud-detection-service"}[10m])), 1)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: fraud
          slo: decision-latency
        annotations:
          summary: "High fraud evaluation latency"
          description: "Average fraud evaluation latency is above 250ms."

      - alert: AlertNotificationLatencyHigh
        expr: |
          (
            sum(rate(fraud_alert_notification_latency_seconds_sum{application="alert-service"}[10m]))
            /
            clamp_min(sum(rate(fraud_alert_notification_latency_seconds_count{application="alert-service"}[10m])), 1)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          team: fraud
          slo: notification-latency
        annotations:
          summary: "High notification latency"
          description: "Average notification latency is above 1.5s."

      - alert: KafkaDlqTrafficDetected
        expr: sum(increase(kafka_dlq_events_received_total[5m])) by (application) > 0
        for: 0m
        labels:
          severity: warning
          team: fraud
        annotations:
          summary: "DLQ traffic detected"
          description: "Application {{ $labels.application }} received {{ $value }} DLQ events in the last 5 minutes."

      - alert: KafkaDlqReprocessFailed
        expr: sum(increase(kafka_dlq_events_failed_total[5m])) by (application) > 0
        for: 0m
        labels:
          severity: critical
          team: fraud
        annotations:
          summary: "DLQ reprocessing failures detected"
          description: "Application {{ $labels.application }} failed to reprocess {{ $value }} DLQ events in the last 5 minutes."
